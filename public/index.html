<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<style>
:root{--bg:#f3efe6;--card:#fff;--ink:#1d2b3a;--mute:#6b7785;--line:#ddd6c6;--acc:#0b6e69}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:32px 16px;display:grid;gap:20px;grid-template-columns:1fr 1fr}
h1{grid-column:1/-1;margin:0;font-size:2rem}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{margin:0 0 12px;font-size:1.05rem}
form{display:grid;gap:8px}
input,select,button{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px}
button.primary{background:var(--acc);color:#fff;border:0;cursor:pointer}
.wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right}
.bar{height:10px;background:var(--acc);border-radius:5px;margin-top:4px}
.row{margin-bottom:12px}
.del{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.2rem}
#msg{color:#b3261e;min-height:1.2em;margin:0}
@media(max-width:700px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Expense Tracker</h1>
  <section>
    <h2>Add expense</h2>
    <form id="form">
      <input id="title" placeholder="What was it for?" required>
      <input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount (₹)" required>
      <select id="category">
        <option>Food</option><option>Travel</option><option>Study</option>
        <option>Bills</option><option>Shopping</option><option>Other</option>
      </select>
      <input id="date" type="date" required>
      <button class="primary" type="submit">Add expense</button>
      <p id="msg"></p>
    </form>
  </section>
  <section>
    <h2>Spending by category (total <span id="total">₹0</span>)</h2>
    <div id="cats"></div>
    <h2>By month</h2>
    <div id="months"></div>
  </section>
  <section class="wide">
    <h2>All expenses</h2>
    <table><thead><tr><th>Date</th><th>Title</th><th>Category</th><th class="num">Amount</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const money = n => "₹" + Number(n).toFixed(2);
$("date").valueAsDate = new Date();

async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function load() {
  const [expenses, summary] = await Promise.all([api("/api/expenses"), api("/api/summary")]);

  $("rows").innerHTML = expenses.length ? "" : '<tr><td colspan="5">No expenses yet. Add your first one.</td></tr>';
  expenses.forEach(e => {
    const tr = document.createElement("tr");
    [e.spent_on, e.title, e.category].forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    const amt = document.createElement("td"); amt.className = "num"; amt.textContent = money(e.amount); tr.appendChild(amt);
    const act = document.createElement("td");
    const del = document.createElement("button"); del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Delete expense");
    del.onclick = async () => { await api("/api/expenses/" + e.id, { method: "DELETE" }); load(); };
    act.appendChild(del); tr.appendChild(act);
    $("rows").appendChild(tr);
  });

  $("total").textContent = money(summary.total);
  const max = Math.max(...summary.byCategory.map(c => c.total), 1);
  $("cats").innerHTML = "";
  summary.byCategory.forEach(c => {
    const d = document.createElement("div"); d.className = "row";
    d.textContent = c.category + ": " + money(c.total);
    const bar = document.createElement("div"); bar.className = "bar"; bar.style.width = (c.total / max * 100) + "%";
    d.appendChild(bar); $("cats").appendChild(d);
  });
  $("months").innerHTML = "";
  summary.byMonth.forEach(m => {
    const d = document.createElement("div"); d.textContent = m.month + ": " + money(m.total); $("months").appendChild(d);
  });
}

$("form").onsubmit = async e => {
  e.preventDefault();
  try {
    await api("/api/expenses", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: $("title").value, amount: $("amount").value, category: $("category").value, spent_on: $("date").value }),
    });
    $("msg").textContent = "";
    $("title").value = ""; $("amount").value = "";
    load();
  } catch (err) { $("msg").textContent = err.message; }
};
load();
</script>
</body>
</html>
